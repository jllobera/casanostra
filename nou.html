<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afegir nou element - Inventari</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <h1>Afegir un nou element a l'inventari</h1>
        <nav>
            <a href="index.html">Tornar a l'inici</a>
        </nav>
    </header>

    <main>
        <form id="add-item-form">
            <div class="form-group">
                <label for="name">Nom de l'element:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="id">Identificador de l'element (per exemple "sofa-nora", "moble-tv-jysk"):</label>
                <input type="text" id="id" name="id" required>
            </div>

            <div class="form-group">
                <label for="category">Categoria:</label>
                <input type="text" id="category" name="category" required>
            </div>

            <div class="form-group">
                <label for="price">Preu:</label>
                <input type="number" id="price" name="price" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="store">Botiga:</label>
                <input type="text" id="store" name="store" required>
            </div>

            <div class="form-group">
                <label for="url">Pàgina web:</label>
                <input type="text" id="url" name="url">
            </div>

            <!-- SECCIÓ DE PUJADA DIRECTA D'IMATGES -->
            <div class="form-group" style="border: 1px dashed #28a745; padding: 15px; border-radius: 5px; background: #f4fff4;">
                <label><strong>Pujar Imatge Independent a GitHub:</strong></label>
                <div style="margin-top: 8px;">
                    <input type="file" id="custom-image-file" accept="image/*">
                </div>
                <div style="margin-top: 8px;">
                    <input type="text" id="custom-image-name" placeholder="Nom del fitxer (ex: sofa-nora-detall)" style="width: 100%; padding: 5px;">
                </div>
                <button type="button" onclick="uploadCustomImage()" style="margin-top: 8px; padding: 6px 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">
                    Pujar imatge ara
                </button>
                <p id="upload-status" style="margin-top: 5px; font-size: 0.9em; font-weight: bold;"></p>
            </div>

            <div class="form-group">
                <label for="main-image">Ruta de la Imatge Principal (S'omplirà sola al pujar la imatge o pots escriure-la a mà):</label>
                <input type="text" id="main-image" name="mainImage" placeholder="assets/images/el-teu-nom.jpg">
            </div>

            <div class="form-group">
                <label for="description">Descripció:</label>
                <textarea id="description" name="description" rows="4" required></textarea>
            </div>

            <div class="form-group">
                <label for="characteristics">Característiques:</label>
                <textarea id="characteristics" name="characteristics" rows="4" required></textarea>
            </div>

            <button type="submit" class="btn-submit">Guardar element</button>
        </form>
    </main>

    <script src="assets/js/app.js"></script>
</body>
</html>
